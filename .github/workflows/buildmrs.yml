name: Build All-in-One MRS

on:
  schedule:
    - cron: '0 20 * * *' # 每天北京时间凌晨 4:00 自动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. 清理旧文件并下载 Mihomo 内核
        run: |
          # 先删掉仓库里所有旧的 .mrs 和 source 中间产物
          rm -f *.mrs
          rm -rf source
          mkdir -p source

          # 下载最新内核
          LATEST_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("mihomo-linux-amd64-compatible-v.*\\.gz$")) | .browser_download_url')
          curl -sL "$LATEST_URL" | gunzip > mihomo
          chmod +x mihomo

      - name: 2. 下载 Anti-AD & AdRules
        run: |
          curl -sL "https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs" -o anti-ad.mrs
          curl -sL "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules-mihomo.mrs" -o adrules.mrs

      - name: 3. 下载并转换 HaGeZi 列表到 source/ 下的 YAML
        run: |
          declare -A lists
          lists=(
            ["hagezi-tif"]="https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif-onlydomains.txt"
            ["hagezi-pro"]="https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.plus-onlydomains.txt"
            ["hagezi-win"]="https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/native.winoffice-onlydomains.txt"
            ["hagezi-gambling"]="https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/gambling-onlydomains.txt"
            ["hagezi-dga"]="https://cdn.jsdelivr.net/gh/hagezi/nrd@latest/domains/dga30.txt"
          )

          for name in "${!lists[@]}"; do
            url="${lists[$name]}"
            echo "正在处理: $name <- $url"
            curl -sL "$url" -o raw.txt

            # 编码归一(UTF-8) + 剔除注释/空行 + 加 +. 前缀
            # 多编码尝试，避免原始列表混入 GBK/UTF-16 等字节导致后续 YAML 非法
            python3 -c "
import sys
raw = open('raw.txt', 'rb').read()
text = None
for enc in ('utf-8-sig', 'utf-8', 'gb18030', 'utf-16'):
    try:
        text = raw.decode(enc); break
    except UnicodeDecodeError:
        pass
if text is None:
    sys.exit('无法识别编码: raw.txt')
out = ['+.' + l.strip() for l in text.splitlines() if l.strip() and not l.strip().startswith('#')]
open('clean.txt', 'w', encoding='utf-8').write('\n'.join(out) + '\n')
"
            rm -f raw.txt

            ./mihomo convert-ruleset domain text clean.txt "source/${name}.yaml"
            rm -f clean.txt
          done

      - name: 4. 校验 YAML 语法并转换为 MRS
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml

          shopt -s nullglob
          files=(source/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::source 目录为空，没有可转换的 YAML"
            exit 1
          fi

          for f in "${files[@]}"; do
            name=$(basename "$f" .yaml)
            if [ ! -s "$f" ] || ! python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1], encoding='utf-8'))" "$f"; then
              echo "::error file=$f::YAML 校验失败"
              exit 1
            fi
            ./mihomo convert-ruleset domain yaml "$f" "${name}.mrs"
            echo "✔ ${name}.mrs 生成成功"
          done

          rm -f mihomo

      - name: 5. 提交更新到仓库
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "Auto Update MRS Rulesets"
            # 先拉取合并（防止你在网页端刚改了 yml 导致冲突），再推送
            git pull --rebase origin main
            git push origin main
          else
            echo "没有需要更新的内容"
          fi
