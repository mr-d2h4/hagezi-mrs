name: Build All-in-One MRS

on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京时间 04:00
  workflow_dispatch:
  push:
    branches-ignore:
      - release
    paths-ignore:
      - '**/README.md'

permissions:
  contents: write

concurrency:
  group: build-all-in-one-mrs
  cancel-in-progress: false

env:
  MIHOMO_REPO: MetaCubeX/mihomo
  RELEASE_BRANCH: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 0. 变量
        run: |
          set -euo pipefail
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5

      - name: 1. 下载 Mihomo 内核
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL=$(curl -fsSL --retry 3 --retry-delay 2 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${MIHOMO_REPO}/releases/latest" \
                | jq -r '[.assets[]? | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url][0] // empty')
          [ -n "${URL}" ] || { echo "::error::获取内核地址失败"; exit 1; }
          echo "内核: ${URL}"
          curl -fsSL --retry 3 --retry-delay 2 "${URL}" | gunzip > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: 2. 下载上游现成 MRS
        run: |
          set -euo pipefail
          mkdir -p publish raw dist/yaml
          curl -fsSL --retry 3 --retry-delay 2 -o publish/anti-ad.mrs \
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs"
          curl -fsSL --retry 3 --retry-delay 2 -o publish/adrules.mrs \
            "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules-mihomo.mrs"

      # 转换规则：删掉 # 开头的行（以及空行），剩下的每一行就是一个域名，
      # 加 +. 前缀写成 clash ruleset 的 payload 列表。
      # 生成的 YAML 全部保留在 dist/yaml/ 里，不删、不回读、不覆盖。
      - name: 3. 生成 YAML（保留）并转换为 MRS
        run: |
          set -euo pipefail
          mkdir -p dist/yaml publish raw

          lists=(
            "hagezi-tif|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif-onlydomains.txt"
            "hagezi-pro|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.plus-onlydomains.txt"
            "hagezi-win|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/native.winoffice-onlydomains.txt"
            "hagezi-gambling|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/gambling-onlydomains.txt"
            "hagezi-dga|https://cdn.jsdelivr.net/gh/hagezi/nrd@latest/domains/dga30.txt"
          )

          for item in "${lists[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            src="raw/${name}.txt"
            yml="dist/yaml/${name}.yaml"

            echo "=================================================="
            echo "==> ${name}"
            echo "    源: ${url}"
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 "${url}" -o "${src}"

            echo "payload:" > "${yml}"
            sed -e '1s/^\xef\xbb\xbf//' \
                -e 's/\r$//' \
                -e 's/^[[:space:]]*//' \
                -e 's/[[:space:]]*$//' \
                "${src}" \
              | grep -v '^#' \
              | grep -v '^$' \
              | sed "s|^|  - '+.|; s|\$|'|" \
              >> "${yml}"

            src_lines=$(wc -l < "${src}")
            kept=$(($(wc -l < "${yml}") - 1))
            echo "    原始 ${src_lines} 行 -> 生成 ${kept} 条规则"
            [ "${kept}" -gt 0 ] || { echo "::error::${name} 没有解析出任何域名"; exit 1; }

            echo "    ---- ${yml} 前 12 行 ----"
            head -n 12 "${yml}" | sed 's/^/    /'
            echo "    ---- ${yml} 后 3 行 ----"
            tail -n 3 "${yml}" | sed 's/^/    /'
            echo "    ------------------------------------------"

            ./mihomo convert-ruleset domain yaml "${yml}" "publish/${name}.mrs"
            [ -s "publish/${name}.mrs" ] || { echo "::error::publish/${name}.mrs 生成失败"; exit 1; }
            echo "    OK publish/${name}.mrs  $(stat -c %s "publish/${name}.mrs") 字节"
          done

      # 只做信息性检查：文件非空 + 打印前 16 字节，不做任何魔数断言、不阻断构建
      - name: 4. 列出产物
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "=========== publish/ ==========="
          for f in publish/*; do
            [ -s "$f" ] || { echo "::error file=$f::空文件"; exit 1; }
            printf '%-22s %12s 字节  head=%s\n' \
              "$(basename "$f")" "$(stat -c %s "$f")" \
              "$(head -c 16 "$f" | od -An -tx1 | tr -d ' \n')"
          done

          echo "=========== dist/yaml/ ==========="
          for f in dist/yaml/*.yaml; do
            printf '%-22s %12s 字节  %8s 条规则\n' \
              "$(basename "$f")" "$(stat -c %s "$f")" "$(($(wc -l < "$f") - 1))"
          done

          rm -f mihomo

      # 中间产物 YAML 和最终 MRS 都上传，可下载后逐行比对
      - name: 5. 上传产物（含中间 YAML）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mrs-build-${{ env.TAG_NAME }}
          path: |
            dist/yaml/*.yaml
            publish/*.mrs
            raw/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: 6. 发布 Release 并推送 release 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(publish/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::publish 为空"; exit 1; }

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG_NAME}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_NAME}" \
              --notes "自动构建于 $(date -u '+%F %T UTC')" \
              --latest
          fi

          { gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName' \
              | tail -n +11 \
              | while read -r t; do gh release delete "$t" --repo "${GITHUB_REPOSITORY}" -y --cleanup-tag || true; done
          } || echo "::warning::清理旧 Release 失败"

          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${RELEASE_BRANCH}"
          git add -A
          git commit -q -m "${RELEASE_NAME}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${RELEASE_BRANCH}"

      - name: 7. 刷新 jsDelivr 缓存
        run: |
          set -uo pipefail
          cd publish
          for f in *.mrs; do
            echo "purge ${f}"
            curl -fsSL --max-time 60 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${RELEASE_BRANCH}/${f}" >/dev/null \
              || echo "::warning::purge 失败: ${f}"
          done
