name: Build All-in-One MRS

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. 下载 Mihomo 内核
        run: |
          LATEST_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("mihomo-linux-amd64-compatible-v.*\\.gz$")) | .browser_download_url')
          curl -sL "$LATEST_URL" | gunzip > mihomo
          chmod +x mihomo

      - name: 2. 下载并保存现有的 MRS
        run: |
          curl -L "https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs" -o anti-ad.mrs
          curl -L "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules-mihomo.mrs" -o adrules.mrs

      - name: 3. 下载并转换 HaGeZi 列表
        run: |
          # 仅保留：TIF, Pro+, Native, Gambling
          block_lists=("tif" "pro.plus" "native.winoffice" "gambling")
          for f in "${block_lists[@]}"; do
            curl -sL "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/${f}-onlydomains.txt" -o "${f}-raw.txt"
            sed -e '/^#/d' -e '/^$/d' -e 's/^/+./' "${f}-raw.txt" > "${f}.txt"
            ./mihomo convert-ruleset domain text "${f}.txt" "hagezi-${f}.mrs"
            rm "${f}-raw.txt" "${f}.txt"
          done

          # 处理放行列表 (保持不变)
          curl -sL "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/spam-tlds-allow-onlydomains.txt" -o allow-raw.txt
          sed -e '/^#/d' -e '/^$/d' allow-raw.txt > allow.txt
          ./mihomo convert-ruleset domain text allow.txt "hagezi-allow.mrs"
          rm allow-raw.txt allow.txt mihomo

      - name: 4. 提交更新
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add *.mrs
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update MRS" && git push)
