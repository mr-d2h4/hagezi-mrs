name: Build All-in-One MRS

on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京时间 04:00
  workflow_dispatch:
  push:
    branches-ignore:
      - release
    paths-ignore:
      - '**/README.md'

permissions:
  contents: write

concurrency:
  group: build-all-in-one-mrs
  cancel-in-progress: false

env:
  MIHOMO_REPO: MetaCubeX/mihomo
  RELEASE_BRANCH: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 0. 变量
        run: |
          set -euo pipefail
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: 1. 下载 Mihomo 内核
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL=$(curl -fsSL --retry 3 --retry-delay 2 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${MIHOMO_REPO}/releases/latest" \
                | jq -r '[.assets[]? | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url][0] // empty')
          [ -n "${URL}" ] || { echo "::error::获取内核地址失败"; exit 1; }
          echo "内核: ${URL}"
          curl -fsSL --retry 3 --retry-delay 2 "${URL}" | gunzip > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: 2. 下载上游现成 MRS
        run: |
          set -euo pipefail
          mkdir -p publish
          curl -fsSL --retry 3 --retry-delay 2 -o publish/anti-ad.mrs \
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs"
          curl -fsSL --retry 3 --retry-delay 2 -o publish/adrules.mrs \
            "https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules-mihomo.mrs"

      - name: 3. HaGeZi 列表转 MRS
        run: |
          set -euo pipefail
          lists=(
            "hagezi-tif|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif-onlydomains.txt"
            "hagezi-pro|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.plus-onlydomains.txt"
            "hagezi-win|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/native.winoffice-onlydomains.txt"
            "hagezi-gambling|https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/gambling-onlydomains.txt"
            "hagezi-dga|https://cdn.jsdelivr.net/gh/hagezi/nrd@latest/domains/dga30.txt"
          )

          for item in "${lists[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            echo "==> ${name}"
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 20 "${url}" -o raw.txt

            # 去掉 # 开头的行，其余每行就是一个域名，加上 +. 前缀生成规则集 YAML
            {
              echo "payload:"
              awk '!/^#/ { gsub(/\r/, ""); sub(/[ \t]+$/, ""); if ($0 != "") print "  - \047+." $0 "\047" }' raw.txt
            } > "${name}.yaml"
            rm -f raw.txt

            count=$(grep -c "^  - " "${name}.yaml" || true)
            [ "${count:-0}" -gt 0 ] || { echo "::error::${name} 没有解析出域名"; exit 1; }

            ./mihomo convert-ruleset domain yaml "${name}.yaml" "publish/${name}.mrs"
            [ -s "publish/${name}.mrs" ] || { echo "::error::publish/${name}.mrs 生成失败"; exit 1; }
            echo "OK publish/${name}.mrs  ${count} 条"
            rm -f "${name}.yaml"
          done

      - name: 4. 校验产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(publish/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::publish 为空"; exit 1; }
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "::error file=$f::空文件"; exit 1; }
            if [ "$(head -c 3 "$f")" = "MRS" ]; then
              head_ok="MRS头"
            else
              head_ok="非MRS头"
            fi
            printf '%-24s %10s 字节  %s\n' "$(basename "$f")" "$(stat -c %s "$f")" "${head_ok}"
          done
          rm -f mihomo

      - name: 5. 发布 Release 并推送 release 分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(publish/*)

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG_NAME}" "${files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_NAME}" \
              --notes "自动构建于 $(date -u '+%F %T UTC')" \
              --latest
          fi

          # 只保留最近 10 个 Release（失败不影响构建）
          { gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName' \
              | tail -n +11 \
              | while read -r t; do gh release delete "$t" --repo "${GITHUB_REPOSITORY}" -y --cleanup-tag || true; done
          } || echo "::warning::清理旧 Release 失败"

          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${RELEASE_BRANCH}"
          git add -A
          git commit -q -m "${RELEASE_NAME}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${RELEASE_BRANCH}"

      - name: 6. 刷新 jsDelivr 缓存
        run: |
          set -uo pipefail
          cd publish
          for f in *.mrs; do
            echo "purge ${f}"
            curl -fsSL --max-time 60 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${RELEASE_BRANCH}/${f}" >/dev/null \
              || echo "::warning::purge 失败: ${f}"
          done
